[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Customer support graph workflow agent for a shipping company using Google ADK 2.0"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.8.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.ty.src]
exclude = [".venv/**"]
